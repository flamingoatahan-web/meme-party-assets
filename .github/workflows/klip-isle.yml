# NE DİYOR?! KLİPLERİ: "Meme Party - Dublaj" aracının "Oyuna gönder" tuşu klibi oyunun veritabanına bırakır
# (onayli/klipgelen/<id>). Bu iş birkaç dakikada bir bakar: gelen klibi küçültür (en çok 1280x720, 30 fps, H.264),
# kesilen kısmı keser, paketler/<paket>/<klip>.mp4 + .json olarak buraya koyar ve gelen kutusunu boşaltır.
# Oyun yeni klibi kendisi bulur.
name: Klip işle

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: klip-isle
  cancel-in-progress: false

jobs:
  isle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Gelen klip var mı?
        id: bak
        run: |
          DB=https://meme-party-45451-default-rtdb.europe-west1.firebasedatabase.app
          n=$(curl -s --max-time 20 "$DB/onayli/klipgelen.json?shallow=true" || echo null)
          m=$(curl -s --max-time 20 "$DB/onayli/klipislem.json?shallow=true" || echo null)
          echo "gelen: $n · paket işleri: $m"
          if { [ -z "$n" ] || [ "$n" = "null" ]; } && { [ -z "$m" ] || [ "$m" = "null" ]; }; then echo "var=0" >> "$GITHUB_OUTPUT"; else echo "var=1" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@v4
        if: steps.bak.outputs.var == '1'

      - name: ffmpeg
        if: steps.bak.outputs.var == '1'
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: Klipleri işle
        if: steps.bak.outputs.var == '1'
        run: node .github/scripts/klip-isle.mjs
